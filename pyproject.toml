[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voyage-lab"
version = "0.1.0"
description = "A reproducible, offline maritime voyage simulation workbench"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2.2,<3", "pyproj>=3.7,<4", "shapely>=2.1,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
voyage-lab = "voyage_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["voyage_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
