name: Verify Voyage Lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check voyage_lab scripts tests benchmarks
      - run: uv run --frozen ruff format --check voyage_lab scripts tests benchmarks
      - run: uv run --frozen pytest -q
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e
      - run: uv run --frozen voyage-lab demo --output artifacts/comparison.json
      - run: uv run --frozen voyage-lab replay artifacts/comparison.json
      - run: uv build
